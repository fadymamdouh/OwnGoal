<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>أون جول — نسخة محلية</title>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@400;600;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --attack:#D7263D;--attack-glow:#FF6B35;
  --defense:#1B4F72;--defense-glow:#2ECC71;
  --special:#7D3C98;--special-glow:#F1C40F;
  --rare:#B8860B;--rare-glow:#F1C40F;
  --ink:#F0E6D3;--muted:#A89880;--line:#2C2C54;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d0d16;color:var(--ink);font-family:'Cairo',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{flex:1;display:flex;flex-direction:column;max-width:520px;margin:0 auto;width:100%;
  padding:14px 12px 0}

/* ---------- lobby ---------- */
.brand{font-family:'Rakkas',cursive;font-size:52px;text-align:center;line-height:1;
  color:var(--attack-glow);margin-top:22px}
.brand small{display:block;font-family:'Oswald',sans-serif;font-size:11px;
  letter-spacing:.5em;color:var(--muted);margin-top:6px}
.panel{background:#15151f;border:1px solid var(--line);border-radius:14px;padding:16px;
  margin-top:18px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
input{background:#0d0d16;border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:12px;font-size:16px;font-family:inherit;text-align:center;width:100%}
input::placeholder{color:#55525f}
.opt{background:#0d0d16;border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:11px 6px;font-size:13px;font-weight:600;transition:.15s}
.opt.on{background:var(--attack);border-color:var(--attack);color:#fff}
.go{width:100%;background:var(--attack-glow);color:#1a0505;border-radius:10px;padding:14px;
  font-size:17px;font-weight:900;margin-top:4px}
.go.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700}
.hint{color:var(--muted);font-size:12px;line-height:1.6;text-align:center;margin-top:12px}
.code{font-family:'Oswald',sans-serif;font-size:34px;letter-spacing:.28em;text-align:center;
  color:var(--special-glow);padding:6px 0}

/* ---------- table ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 10px;background:#15151f;border:1px solid var(--line);border-radius:12px}
.score{font-family:'Oswald',sans-serif;font-size:24px;letter-spacing:.08em}
.who{font-size:11px;color:var(--muted)}
.pill{font-size:10px;font-family:'Oswald',sans-serif;letter-spacing:.14em;padding:3px 7px;
  border-radius:20px;background:#0d0d16;border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--defense-glow);color:#04220f;border-color:transparent}
.prompt{text-align:center;padding:13px 10px;margin-top:10px;border-radius:12px;
  background:#1a1226;border:1px solid #33244a;font-weight:700;font-size:15px;line-height:1.5}
.prompt.mine{background:#1d0f10;border-color:#4a2226}
.prompt small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:4px}
.feed{margin-top:8px;max-height:66px;overflow-y:auto;font-size:12px;color:var(--muted);
  line-height:1.75}
.feed b{color:var(--ink);font-weight:700}

/* ---------- opponents: face-down fans ---------- */
.oppzone{margin-top:10px;text-align:center}
.fan{display:flex;justify-content:center;align-items:flex-end;gap:14px;
  min-height:62px}
.seatfan{display:flex;align-items:flex-end}
.seatfan.mate{opacity:.8}
.back{width:42px;height:58px;border-radius:7px;flex:0 0 auto;
  background:repeating-linear-gradient(45deg,#1b1230 0 6px,#160f28 6px 12px);
  border:1px solid #33244a;margin-inline-start:-18px;position:relative;
  box-shadow:0 3px 9px #0007}
.back:first-child{margin-inline-start:0}
.back .crest{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:'Rakkas',cursive;font-size:14px;color:#3d2b63}
.back.drawn{animation:dealin .32s ease-out}
@keyframes dealin{from{transform:translateY(-24px) scale(.86);opacity:0}
  to{transform:none;opacity:1}}

/* ---------- the table ---------- */
.table{margin-top:10px;border-radius:16px;position:relative;
  background:radial-gradient(ellipse at 50% 40%,#123021 0%,#0c1f16 62%,#08150f 100%);
  border:1px solid #1c3a28;min-height:160px;overflow:hidden;padding:10px 0 74px}
.table::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:#ffffff14}

/* Every card played stays on the table. Only the last two are legible; older
   ones collapse to a sliver you can scroll back through. */
.hist{display:flex;align-items:center;overflow-x:auto;padding:4px 12px 6px;
  min-height:86px;position:relative;z-index:2}
.hist::-webkit-scrollbar{display:none}
.hcard{width:54px;height:76px;border-radius:8px;border:1px solid #232338;
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:5px 3px;text-align:center;position:relative}
.hcard.attack{background:linear-gradient(155deg,#2a0a0a,#0d0000)}
.hcard.defense{background:linear-gradient(155deg,#040e1a,#030b14)}
.hcard.special{background:linear-gradient(155deg,#130820,#070311)}
.hcard.rare{background:linear-gradient(155deg,#241705,#0d0700)}
.hcard .nm{font-family:'Rakkas',cursive;font-size:12px;line-height:1.05;margin-top:3px}
.hcard .en{font-family:'Oswald',sans-serif;font-size:6px;letter-spacing:.14em;
  color:var(--muted)}
.hcard .by{position:absolute;bottom:2px;left:0;right:0;font-size:6.5px;
  font-weight:700;color:var(--muted)}
.hcard.mine{box-shadow:0 0 0 1px var(--attack-glow)}
.hcard.theirs{box-shadow:0 0 0 1px var(--defense-glow)}
.hcard + .hcard{margin-inline-start:6px}
.hcard.old + .hcard.old,.hcard.old + .hcard{margin-inline-start:-38px}
.hcard.old{opacity:.72}
.hcard.old .nm,.hcard.old .en,.hcard.old .by{display:none}
.hcard.old .edge{position:absolute;top:6px;bottom:6px;inset-inline-end:4px;
  width:2px;border-radius:2px;background:#ffffff33}
.hcard.fresh{animation:toTable .34s cubic-bezier(.22,1.2,.36,1) both}
.hcard.freshflip{animation:flipin .46s ease-out both}
@keyframes toTable{from{transform:translateY(76px) scale(.72) rotate(-7deg);opacity:0}
  to{transform:none;opacity:1}}
@keyframes flipin{0%{transform:translateY(-56px) rotateY(180deg) scale(.8);opacity:0}
  60%{opacity:1}100%{transform:none;opacity:1}}
.sep{flex:0 0 auto;width:1px;height:48px;background:#ffffff26;
  margin-inline-start:8px;align-self:center}
.gap{flex:0 0 auto;margin-inline-start:8px;align-self:center;color:#7a5c3a;
  font-weight:900;font-size:13px;letter-spacing:.1em}
.tablehint{position:absolute;top:44%;left:0;right:0;text-align:center;
  font-size:10px;color:#5c7a68;font-weight:700;z-index:1}

/* ---------- deck + discard ---------- */
.deckpile,.discpile{position:absolute;bottom:9px;width:44px;height:60px;z-index:3}
.deckpile{inset-inline-end:12px}
.discpile{inset-inline-start:12px}
.stk{position:absolute;inset:0;border-radius:7px;border:1px solid #33244a;
  background:repeating-linear-gradient(45deg,#1b1230 0 5px,#160f28 5px 10px)}
.stk:nth-child(2){transform:translate(2px,-2px)}
.stk:nth-child(3){transform:translate(4px,-4px)}
.cnt{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:4;pointer-events:none}
.cnt b{font-family:'Oswald',sans-serif;font-size:16px;color:var(--ink)}
.cnt span{font-size:8px;color:var(--muted);font-weight:700;margin-top:1px}
.deckpile.can{cursor:pointer}
.deckpile.can .stk:nth-child(3){box-shadow:0 0 0 1.5px var(--special-glow)}
.deckpile.can::after{content:'اسحب';position:absolute;top:-16px;left:0;right:0;
  text-align:center;font-size:10px;font-weight:900;color:var(--special-glow);
  animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.45}}
.discpile .stk{background:repeating-linear-gradient(45deg,#241206 0 5px,#1b0d04 5px 10px);
  border-color:#4a2a12}
.drawpick{position:absolute;bottom:74px;inset-inline-end:6px;display:flex;gap:4px;z-index:6}
.drawpick button{background:#15151f;border:1px solid var(--special-glow);
  color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700}
.flyer{position:absolute;bottom:9px;inset-inline-end:12px;width:44px;height:60px;
  border-radius:7px;z-index:7;border:1px solid #33244a;pointer-events:none;
  background:repeating-linear-gradient(45deg,#1b1230 0 5px,#160f28 5px 10px);
  animation:fly .5s cubic-bezier(.4,0,.6,1) forwards}
@keyframes fly{0%{opacity:1}
  100%{transform:translate(84px,160px) rotate(12deg) scale(.82);opacity:0}}
/* a card dealt but not yet pulled off the deck (LUCK mode) */
.card.facedown{background:repeating-linear-gradient(45deg,#1b1230 0 7px,#160f28 7px 14px)}
.card.facedown .half,.card.facedown .splitmark{visibility:hidden}
.card.facedown::after{content:'مستني السحب';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;font-family:'Rakkas',cursive;
  font-size:15px;color:#5b4488;text-align:center;padding:0 10px}

/* ---------- hand ---------- */
.hand{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 18px;scroll-snap-type:x mandatory}
.hand::-webkit-scrollbar{display:none}
.card{flex:0 0 108px;height:152px;border-radius:10px;position:relative;overflow:hidden;
  border:1px solid #232338;display:flex;flex-direction:column;padding:7px 6px;
  scroll-snap-align:center;transition:.15s;text-align:center}
.card.attack{background:linear-gradient(155deg,#2a0a0a,#0d0000)}
.card.defense{background:linear-gradient(155deg,#040e1a,#030b14)}
.card.special{background:linear-gradient(155deg,#130820,#070311)}
.card.rare{background:linear-gradient(155deg,#241705,#0d0700)}
.card.dead{opacity:.32;filter:grayscale(.6)}
.card.pick{transform:translateY(-8px);box-shadow:0 0 0 2px var(--defense-glow)}
.card .en{font-family:'Oswald',sans-serif;font-size:7px;letter-spacing:.16em;color:var(--muted)}
.card .ar{font-family:'Rakkas',cursive;font-size:19px;line-height:1.05;margin-top:1px}
.card .ico{flex:1;display:flex;align-items:center;justify-content:center}
.card .ln{font-size:8.5px;line-height:1.35;font-weight:700;opacity:.92}
.card .bar{height:3px;border-radius:2px;margin-top:5px}
.tick{position:absolute;top:5px;left:5px;font-size:9px;font-weight:900;color:var(--defense-glow)}
/* A split card is ONE physical card carrying two faces. Both are always shown,
   because which one you may use depends on whether you are attacking or
   defending — and because players must be able to reason about the deck
   (e.g. Block Save shares its card with Super Shot). */
.card.split{padding:0;justify-content:stretch}
.half{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:6px 5px;text-align:center;position:relative;
  min-height:0}
.half + .half{border-top:1px dashed #ffffff2e}
.half.attack{background:linear-gradient(155deg,#2a0a0a,#0d0000)}
.half.defense{background:linear-gradient(155deg,#040e1a,#030b14)}
.half.special{background:linear-gradient(155deg,#130820,#070311)}
.half.rare{background:linear-gradient(155deg,#241705,#0d0700)}
.half .en{font-family:'Oswald',sans-serif;font-size:6.5px;letter-spacing:.15em;
  color:var(--muted)}
.half .ar{font-family:'Rakkas',cursive;font-size:17px;line-height:1.05}
.half .ico{margin-top:1px}
.half.off{opacity:.3;filter:grayscale(.7)}
.half.on{box-shadow:inset 0 0 0 1px var(--defense-glow)}
.half.on::after{content:'▲';position:absolute;bottom:2px;left:50%;
  transform:translateX(-50%);font-size:7px;color:var(--defense-glow)}
.splitmark{position:absolute;top:50%;inset-inline-start:3px;
  transform:translateY(-50%);font-size:7px;color:#ffffff4d;font-weight:900;
  letter-spacing:.1em;writing-mode:vertical-rl;z-index:2}
.dual{display:flex;gap:6px;margin-top:6px}
.dual button{flex:1;border-radius:8px;padding:8px 4px;font-size:11px;font-weight:700;
  background:#15151f;border:1px solid var(--line);color:var(--ink)}
.over{text-align:center;padding:22px 12px}
.over .big{font-family:'Rakkas',cursive;font-size:40px;line-height:1.1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div id="lobby">
    <div class="brand">أون جول<small>OWN GOAL</small></div>

    <div class="panel">
      <h2>ابدأ ماتش جديد</h2>
      <input id="name" placeholder="اسمك" maxlength="14">
      <div class="row" style="margin-top:10px">
        <button class="opt on" data-fmt="bot">ضد البوت</button>
        <button class="opt" data-fmt="1v1">1 ضد 1</button>
        <button class="opt" data-fmt="2v2">2 ضد 2</button>
      </div>
      <div class="row">
        <button class="opt on" data-mode="LUCK">مود الحظ</button>
        <button class="opt" data-mode="STRATEGY">مود التكتيك</button>
      </div>
      <button class="go" id="create">اعمل أوضة</button>
    </div>

    <div class="panel">
      <h2>ادخل بكود أوضة</h2>
      <input id="joincode" placeholder="ABC12" maxlength="5"
             style="font-family:Oswald;letter-spacing:.3em;text-transform:uppercase">
      <button class="go ghost" id="join">دخول</button>
    </div>
    <div class="hint">أول واحد يوصل 3 أهداف يكسب.<br>الكروت المقسومة ليها وشين — هجوم ودفاع.</div>
  </div>

  <div id="waiting" class="hide">
    <div class="brand" style="font-size:34px;margin-top:30px">مستني الخصم</div>
    <div class="panel"><h2 style="text-align:center">كود الأوضة</h2>
      <div class="code" id="roomcode">—</div>
      <div class="hint">ابعت الكود لصاحبك عشان يدخل بيه</div></div>
    <div class="panel" id="lobbylist"></div>
    <button class="go ghost" id="exitwait" style="margin-top:12px">اخرج من الأوضة</button>
  </div>

  <div id="game" class="hide">
    <div class="top">
      <div><div class="score" id="score">0 — 0</div><div class="who" id="names">—</div></div>
      <div style="text-align:left"><span class="pill" id="turnpill">—</span>
        <div class="who" id="deckinfo" style="margin-top:4px">—</div></div>
    </div>

    <div class="oppzone">
      <div class="fan" id="fan"></div>
      <div class="who" id="oppname">—</div>
    </div>

    <div class="table" id="table">
      <div class="hist" id="hist"></div>
      <div class="tablehint" id="tablehint">الطرابيزة فاضية</div>
      <div class="discpile">
        <div class="stk"></div><div class="stk"></div><div class="stk"></div>
        <div class="cnt"><b id="discard">0</b><span>حرق</span></div>
      </div>
      <div class="deckpile" id="deckpile">
        <div class="stk"></div><div class="stk"></div><div class="stk"></div>
        <div class="cnt"><b id="deckleft">0</b><span>ديك</span></div>
      </div>
      <div class="drawpick hide" id="draws"></div>
    </div>

    <div class="prompt" id="prompt">—</div>
    <div class="feed" id="feed"></div>
    <div class="hand" id="hand"></div>
    <div class="over hide" id="over"></div>
    <button class="go ghost" id="exitgame" style="margin-top:14px">اخرج من الماتش</button>
  </div>
</div>
<script>
// ============ generated by scripts/build_offline.py — do not edit ============
// generated from references/rules.json — do not edit

  let s = (seed ?? Math.floor(Math.random() * 2 ** 31)) | 0 || 1;
  return {
    next() { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 2 ** 32; },
    int(n) { return Math.floor(this.next() * n); },
    pick(a) { return a[this.int(a.length)]; },
    shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = this.int(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
}

const faceOfClass = (card, klass) =>
  card.faces.find(f => CARD_RULES[f].class === klass) || null;

class Seat {
  constructor(index, name) {
    this.index = index;
    this.name = name;
    this.hand = [];
    this.fouled = false;         // may play Penalty
    this.goalUnlocked = false;    // partner's Assist landed
  }
  has(face) { return this.hand.some(c => c.faces.includes(face)); }
  find(id) { return this.hand.find(c => c.id === id); }
}
class Game {
  constructor({ mode = 'LUCK', matchType = 'ONE_V_ONE', names = null, seed = null } = {}) {
    if (!RULES.play_modes[mode]) throw new Error(`unknown mode ${mode}`);
    this.mode = mode;
    this.matchType = matchType;
    this.rng = makeRng(seed);
    this.n = matchType === 'ONE_V_ONE' ? 2 : 4;
    const nm = names || Array.from({ length: this.n }, (_, i) => `P${i + 1}`);
    this.seats = Array.from({ length: this.n }, (_, i) => new Seat(i, nm[i]));
    this.score = [0, 0];
    this.log = [];
    this.eventId = 0;

    this.deck = this._buildDeck();
    this.discard = [];
    for (const s of this.seats) for (let i = 0; i < HAND; i++) s.hand.push(this._draw());

    this.possession = this.rng.int(this.n);
    this.defender = this._next(this.possession);
    this.chain = [];
    this.owed = 0;
    this.defOwed = 0;
    this.noVarReview = false;   // set when a goal has already had its VAR review
    this.pending = null;
    this.over = false;
    this.winner = null;
    this.phase = this._openAttack();
  }

  _buildDeck() {
    const removed = new Set(RULES.match_types_detail[this.matchType].removed_cards);
    const disabled = new Set(RULES.play_modes[this.mode].disabled_cards);
    const deck = [];
    let id = 0;
    for (const spec of RULES.physical_cards) {
      if (spec.faces.some(f => removed.has(f) || disabled.has(f))) continue;
      for (let i = 0; i < spec.copies; i++) {
        deck.push({ id: `c${id++}`, faces: [...spec.faces], kind: spec.type });
      }
    }
    return this.rng.shuffle(deck);
  }

  // ------------------------------------------------------------- helpers

  team(i) { return i % 2; }
  _partner(i) { return (i + 2) % this.n; }
  _next(i) { return (i + 1) % this.n; }

  _draw() {
    if (!this.deck.length) {
      if (!this.discard.length) return null;
      this.deck = this.rng.shuffle(this.discard);
      this.discard = [];
      this._emit('deck_recycled');
    }
    return this.deck.pop();
  }

  _burn(seat, card) {
    seat.hand.splice(seat.hand.indexOf(card), 1);
    this.discard.push(card);
  }

  _emit(kind, extra = {}) {
    const e = { id: ++this.eventId, kind, ...extra };
    this.log.push(e);
    return e;
  }

  _refill(seat) {
    while (seat.hand.length < HAND) {
      const c = this._draw();
      if (!c) break;
      seat.hand.push(c);
    }
  }
  _refillAll() { for (const s of this.seats) this._refill(s); }

  _strategy() { return this.mode === 'STRATEGY'; }

  // L18: cards drawn but never played are burned, so a hand never grows.
  _burnOwed(seatIndex, n) {
    const seat = this.seats[seatIndex];
    for (let i = 0; i < n; i++) {
      if (!seat.hand.length) break;
      this._burn(seat, seat.hand[this.rng.int(seat.hand.length)]);
      this._emit('leftover_burned', { seat: seatIndex });
    }
  }

  _playableAttacks(seat, lastOfChain) {
    const out = [];
    for (const c of seat.hand) {
      const f = faceOfClass(c, 'attack');
      if (!f) continue;
      if (f === 'PENALTY' && !seat.fouled) continue;
      if (f === 'GOAL' && !seat.goalUnlocked) continue;
      // a shot closes the chain, so it may only be the final card
      if (SHOT_STAGE.has(f) && !lastOfChain && this._strategy()) continue;
      out.push([c, f]);
    }
    return out;
  }

  // ------------------------------------------------------------- phases

  _openAttack() {
    this.chain = [];
    this.defender = this._next(this.possession);
    if (this._strategy()) { this.owed = 0; return 'attack_draw'; }
    this.owed = 1;
    const c = this._draw();
    if (c) this.seats[this.possession].hand.push(c);
    return 'attack';
  }

  _openDefense() {
    if (this._strategy()) { this.defOwed = 0; return 'defense_draw'; }
    this.defOwed = 1;
    const c = this._draw();
    if (c) this.seats[this.defender].hand.push(c);
    return 'defense';
  }

  // ------------------------------------------------------------- view

  view(seatIndex) {
    const me = this.seats[seatIndex];
    return {
      you: seatIndex,
      mode: this.mode,
      match_type: this.matchType,
      phase: this.phase,
      possession: this.possession,
      defender: this.defender,
      chain: [...this.chain],
      score: [...this.score],
      goals_to_win: GOALS_TO_WIN,
      deck_left: this.deck.length,
      discard: this.discard.length,
      over: this.over,
      winner: this.winner,
      owed: seatIndex === this.possession ? this.owed : this.defOwed,
      pending: this.pending,
      hand: me.hand.map(c => ({ id: c.id, faces: [...c.faces], kind: c.kind })),
      flags: { fouled: me.fouled, goal_unlocked: me.goalUnlocked },
      seats: this.seats.map(s => ({
        index: s.index, name: s.name, team: this.team(s.index), cards: s.hand.length,
      })),
      legal: this.legalActions(seatIndex),
      log: this.log.slice(-12),
    };
  }

  // ------------------------------------------------------------- legality

  legalActions(seatIndex) {
    if (this.over) return [];
    const me = this.seats[seatIndex];
    const acts = [];
    const drawTop = Math.min(3, Math.max(1, this.deck.length + this.discard.length));

    if (this.phase === 'attack_draw' && seatIndex === this.possession) {
      return Array.from({ length: drawTop }, (_, i) => ({ type: 'draw', n: i + 1 }));
    }
    if (this.phase === 'defense_draw' && seatIndex === this.defender) {
      return Array.from({ length: drawTop }, (_, i) => ({ type: 'draw', n: i + 1 }));
    }

    if (this.phase === 'attack' && seatIndex === this.possession) {
      for (const [c, f] of this._playableAttacks(me, this.owed <= 1)) {
        acts.push({ type: 'play', card_id: c.id, face: f });
      }
      for (const f of ['RESHUFFLE', 'END_MATCH']) {
        const c = me.hand.find(x => x.faces.includes(f));
        if (c) acts.push({ type: 'special', card_id: c.id, face: f });
      }
      if (!acts.some(a => a.type === 'play')) acts.push({ type: 'concede_possession' });
      return acts;
    }

    if (this.phase === 'defense' && seatIndex === this.defender) {
      const target = this.chain[this.chain.length - 1];
      for (const c of me.hand) {
        // VAR answers a Goal or a Penalty as a review — the caller picks a side
        if (c.faces.includes('VAR') && (COUNTERS.VAR || new Set()).has(target)) {
          acts.push({ type: 'play', card_id: c.id, face: 'VAR', call: 'heads', counters: true });
          acts.push({ type: 'play', card_id: c.id, face: 'VAR', call: 'tails', counters: true });
          continue;
        }
        let f = faceOfClass(c, 'defense');
        if (!f && c.faces.includes('CHAIN')) f = 'CHAIN';
        if (f && DEFENSE_FACES.has(f)) {
          acts.push({
            type: 'play', card_id: c.id, face: f,
            counters: (COUNTERS[f] || new Set()).has(target),
          });
        } else {
          // mandatory attempt: any card may be burned
          acts.push({ type: 'play', card_id: c.id, face: c.faces[0], counters: false });
        }
      }
      return acts;
    }

    if (this.phase === 'react_own_goal' && seatIndex === this.pending.seat) {
      for (const c of me.hand) {
        if (c.faces.includes('OWN_GOAL')) {
          acts.push({ type: 'play', card_id: c.id, face: 'OWN_GOAL' });
        }
      }
      acts.push({ type: 'pass' });
      return acts;
    }

    if (this.phase === 'react_var' && seatIndex === this.pending.seat) {
      for (const c of me.hand) {
        if (c.faces.includes('VAR')) {
          acts.push({ type: 'play', card_id: c.id, face: 'VAR', call: 'heads' });
          acts.push({ type: 'play', card_id: c.id, face: 'VAR', call: 'tails' });
        }
      }
      acts.push({ type: 'pass' });
      return acts;
    }

    return acts;
  }

  _check(seatIndex, action) {
    const match = this.legalActions(seatIndex).find(a =>
      Object.entries(action).every(([k, v]) => a[k] === v));
    if (!match) {
      throw new Error(`illegal action for seat ${seatIndex}: ${JSON.stringify(action)}`);
    }
    return match;
  }

  // ------------------------------------------------------------- apply

  apply(seatIndex, action) {
    this._check(seatIndex, action);
    const before = this.log.length;
    const handler = {
      attack_draw: 'doDraw', defense_draw: 'doDraw', attack: 'doAttack',
      defense: 'doDefense', react_own_goal: 'doOwnGoal', react_var: 'doVar',
    }[this.phase];
    this[handler](seatIndex, action);
    return this.log.slice(before);
  }

  doDraw(seatIndex, action) {
    const seat = this.seats[seatIndex];
    for (let i = 0; i < action.n; i++) {
      const c = this._draw();
      if (c) seat.hand.push(c);
    }
    this._emit('drew', { seat: seatIndex, n: action.n });
    if (this.phase === 'attack_draw') {
      this.owed = action.n;
      this.phase = 'attack';
      if (!this._playableAttacks(seat, this.owed <= 1).length) this._concede();
    } else {
      this.defOwed = action.n;
      this.phase = 'defense';
    }
  }

  doAttack(seatIndex, action) {
    const seat = this.seats[seatIndex];
    if (action.type === 'concede_possession') { this._concede(); return; }
    const card = seat.find(action.card_id);
    const face = action.face;

    if (action.type === 'special') {
      this._burn(seat, card);
      if (face === 'END_MATCH') this._endMatch(seatIndex);
      else this._reshuffle(seat);
      return;
    }

    this._burn(seat, card);
    this.chain.push(face);
    this.owed -= 1;
    this._emit('attack_played', { seat: seatIndex, face });
    if (face === 'PENALTY') seat.fouled = false;

    // A shot always closes the chain and is always defended.
    if (SHOT_STAGE.has(face)) {
      this._burnOwed(seatIndex, this.owed);
      this.owed = 0;
      this.phase = this._openDefense();
      return;
    }

    if (this._strategy() && this.owed > 0) {
      this._emit('chain_passed', { face });
      if (!this._playableAttacks(seat, this.owed <= 1).length) {
        this._burnOwed(seatIndex, this.owed);
        this.owed = 0;
        this.phase = this._openDefense();
      }
      return;
    }

    this.phase = this._openDefense();
  }

  doDefense(seatIndex, action) {
    const seat = this.seats[seatIndex];
    const card = seat.find(action.card_id);
    const face = action.face;
    const target = this.chain[this.chain.length - 1];
    this._burn(seat, card);
    this.defOwed -= 1;
    const answers = (COUNTERS[face] || new Set()).has(target);

    /* Own Goal does NOT stop a scoring card — it flips it. The point goes to
       the defender and the ball to the attacker. Same resolution as the
       react_own_goal path, so it no longer matters whether the defender plays
       it directly or burns a card first. (rulebook: Own Goal) */
    if (face === 'OWN_GOAL' && answers) {
      this._emit('defense_played', { seat: seatIndex, face, stopped: false });
      this._burnOwed(seatIndex, this.defOwed);
      this.defOwed = 0;
      this._emit('own_goal_played', { seat: seatIndex });
      this._score(seatIndex, 'OWN_GOAL', this.possession);
      return;
    }

    /* VAR is a coin-flip review, never a duel: tails overturns the decision,
       heads confirms it. The caller picks a side first, which is recorded but
       does not change the outcome. One review per event, so a confirmed goal
       cannot then be reviewed again from the react_var phase.
       (rulebook: VAR) */
    if (face === 'VAR' && answers) {
      this._burnOwed(seatIndex, this.defOwed);
      this.defOwed = 0;
      const flip = this.rng.pick(['heads', 'tails']);
      const overturned = flip === 'tails';
      this._emit('var', {
        seat: seatIndex, call: action.call, flip, overturned,
        confirmed: flip === action.call, reviewing: target,
      });
      this._emit('defense_played', { seat: seatIndex, face, stopped: overturned });
      if (overturned) { this._resolveStopped('VAR', seatIndex); return; }
      this.noVarReview = true;     // this event has had its one review
      this._shotSucceeded(seatIndex);
      return;
    }

    const stopped = answers;
    this._emit('defense_played', { seat: seatIndex, face, stopped });

    if (stopped) { this._resolveStopped(face, seatIndex); return; }
    if (this.defOwed > 0) return;   // keep trying with the next drawn card

    if (SHOT_STAGE.has(target)) {
      this._shotSucceeded(seatIndex);
    } else {
      this._emit('stage_passed', { face: target });
      this._refillAll();
      if (this._strategy()) {
        this.phase = 'attack_draw';
      } else {
        this.phase = 'attack';
        const c = this._draw();
        if (c) this.seats[this.possession].hand.push(c);
        this.owed = 1;
        if (!this._playableAttacks(this.seats[this.possession], true).length) this._concede();
      }
    }
  }

  _resolveStopped(face, defSeat) {
    const outcome = POSSESSION[face] || 'neutral';
    if (face === 'FOUL') this.seats[this.possession].fouled = true;

    if (outcome === 'defender') {
      this.possession = this._partner(defSeat);
      // Strategy: whatever the defender has left becomes a counter-attack
      if (this._strategy() && this.defOwed > 0 && this.n === 2) {
        this._refillAll();
        this.owed = this.defOwed;
        this.defOwed = 0;
        this.chain = [];
        this.defender = this._next(this.possession);
        this._emit('counter_attack', { seat: this.possession, cards: this.owed });
        this.phase = 'attack';
        if (!this._playableAttacks(this.seats[this.possession], this.owed <= 1).length) {
          this._concede();
        }
        return;
      }
    } else if (outcome !== 'attacker') {
      this.possession = this._nextWithAttack(this._next(defSeat));
    }
    this._burnOwed(defSeat, this.defOwed);
    this.defOwed = 0;
    this._refillAll();
    this.phase = this._openAttack();
  }

  _shotSucceeded(defSeat) {
    this._burnOwed(defSeat, this.defOwed);
    this.defOwed = 0;
    if (this.seats[defSeat].has('OWN_GOAL')) {
      this.pending = { seat: defSeat, reason: 'shot', face: this.chain[this.chain.length - 1] };
      this.phase = 'react_own_goal';
      return;
    }
    this._score(this.possession, this.chain[this.chain.length - 1]);
  }

  doOwnGoal(seatIndex, action) {
    if (action.type === 'pass') {
      this.pending = null;
      this._score(this.possession, this.chain[this.chain.length - 1]);
      return;
    }
    const seat = this.seats[seatIndex];
    this._burn(seat, seat.find(action.card_id));
    this._emit('own_goal_played', { seat: seatIndex });
    this.pending = null;
    this._score(seatIndex, 'OWN_GOAL', this.possession);
  }

  _score(scorer, face, conceder = null) {
    const c = conceder === null ? this._next(scorer) : conceder;
    this.score[this.team(scorer)] += 1;
    const ev = this._emit('goal', {
      scorer, face, conceder: c, score: [...this.score],
    });
    const victim = this._nextOfTeam(this._next(scorer), this.team(c));
    const reviewed = this.noVarReview;   // already reviewed during the defense
    this.noVarReview = false;
    if (!reviewed && this.seats[victim].has('VAR')) {
      this.pending = { seat: victim, reason: 'goal', event: ev.id, scorer, conceder: c };
      this.phase = 'react_var';
      return;
    }
    this._afterGoal(c);
  }

  doVar(seatIndex, action) {
    const p = this.pending;
    if (action.type === 'pass') {
      this.pending = null;
      this._afterGoal(p.conceder);
      return;
    }
    const seat = this.seats[seatIndex];
    this._burn(seat, seat.find(action.card_id));
    const flip = this.rng.pick(['heads', 'tails']);
    // heads confirms the decision, tails overturns it
    const overturned = flip === 'tails';
    this._emit('var', {
      seat: seatIndex, call: action.call, flip, overturned,
      confirmed: flip === action.call,
    });
    if (overturned) {
      this.score[this.team(p.scorer)] -= 1;
      this._emit('goal_overturned', { scorer: p.scorer, score: [...this.score] });
    }
    this.pending = null;
    this._afterGoal(p.conceder);
  }

  _afterGoal(conceder) {
    this._refillAll();
    for (const t of [0, 1]) {
      if (this.score[t] >= GOALS_TO_WIN) {
        this.over = true;
        this.winner = t;
        this.phase = 'over';
        this._emit('match_over', { winner: t, reason: 'goals', score: [...this.score] });
        return;
      }
    }
    this.possession = this._nextOfTeam(this._next(this.defender), this.team(conceder));
    this.phase = this._openAttack();
  }

  // ------------------------------------------------------------- misc

  _nextWithAttack(start) {
    for (let k = 0; k < this.n; k++) {
      const i = (start + k) % this.n;
      if (this._playableAttacks(this.seats[i], true).length) return i;
    }
    return start;
  }

  _nextOfTeam(start, team) {
    for (let k = 0; k < this.n; k++) {
      const i = (start + k) % this.n;
      if (this.team(i) === team) return i;
    }
    return start;
  }

  _concede() {
    this._emit('possession_conceded', { seat: this.possession });
    this._burnOwed(this.possession, this.owed);
    this.owed = 0;
    this.defOwed = 0;
    this._refillAll();
    this.possession = this._next(this.possession);
    this.phase = this._openAttack();
  }

  _reshuffle(seat) {
    for (let i = 0; i < 2; i++) {
      if (seat.hand.length) this._burn(seat, seat.hand[this.rng.int(seat.hand.length)]);
    }
    this._refill(seat);
    this._emit('reshuffled', { seat: seat.index });
  }

  _endMatch(seatIndex) {
    const mine = this.team(seatIndex);
    const theirs = 1 - mine;
    // level scores hand the win to the opponent
    this.winner = this.score[mine] > this.score[theirs] ? mine : theirs;
    this.over = true;
    this.phase = 'over';
    this._emit('match_over', {
      winner: this.winner, reason: 'end_match', played_by: seatIndex, score: [...this.score],
    });
  }
}

// ----------------------------------------------------------------- bot

const PRIORITY = ['SUPER_SHOT', 'PENALTY', 'SHOT_GOAL', 'GOAL', 'DRIBBLE', 'PASS', 'ASSIST'];
function botAction(game, seatIndex, policy = 'SHOOTER') {
  const acts = game.legalActions(seatIndex);
  if (!acts.length) return null;
  const kinds = new Set(acts.map(a => a.type));

  if (kinds.has('draw')) return { type: 'draw', n: 1 };

  if (game.phase === 'react_own_goal') {
    return acts.find(a => a.face === 'OWN_GOAL') || { type: 'pass' };
  }
  if (game.phase === 'react_var') {
    return acts.find(a => a.face === 'VAR' && a.call === 'heads') || { type: 'pass' };
  }

  if (game.phase === 'defense') {
    const good = acts.filter(a => a.counters);
    if (good.length) {
      good.sort((a, b) =>
        (POSSESSION[a.face] === 'defender' ? 0 : 1) - (POSSESSION[b.face] === 'defender' ? 0 : 1));
      return good[0];
    }
    return [...acts].sort((a, b) =>
      (PRIORITY.includes(a.face) ? 1 : 0) - (PRIORITY.includes(b.face) ? 1 : 0))[0];
  }

  const ahead = game.score[game.team(seatIndex)] > game.score[1 - game.team(seatIndex)];
  const endMatch = acts.find(a => a.face === 'END_MATCH');
  if (endMatch && ahead) return endMatch;

  const plays = acts.filter(a => a.type === 'play');
  if (!plays.length) {
    return acts.find(a => a.face === 'RESHUFFLE') || acts[0];
  }

  let order = PRIORITY;
  if (policy === 'PATIENT') {
    const shots = plays.filter(a => SHOT_STAGE.has(a.face));
    const builds = plays.filter(a => !SHOT_STAGE.has(a.face));
    if (shots.length && builds.length) order = ['ASSIST', 'PASS', 'DRIBBLE', ...PRIORITY];
  }
  const rank = f => (order.indexOf(f) === -1 ? 99 : order.indexOf(f));
  plays.sort((a, b) => rank(a.face) - rank(b.face));
  return plays[0];
}


class Room {
  constructor({onView, onLobby, onError}) {
    Object.assign(this, {onView, onLobby, onError});
    this.game = null; this.seat = 0;
    this.local = true;      // never networked, so leave() has nothing to clean up
    this.isHost = true;
  }
  async leave() { this.game = null; }
  async create(mode, fmt, name) {
    if (fmt !== 'bot') {
      this.onError('النسخة المحلية دي ضد البوت بس.\n' +
        'اللعب مع صاحبك محتاج الموقع مرفوع — راجع web/README.md');
      return null;
    }
    this.game = new Game({mode, matchType: 'ONE_V_ONE', names: [name || 'انت', 'البوت']});
    this.onLobby({code: 'BOT', started: true, size: 1, players: [
      {seat: 0, name: name || 'انت', bot: false}, {seat: 1, name: 'البوت', bot: true}]});
    this._publish(); this._runBot();
    return 'BOT';
  }
  async join() { this.onError('الدخول بكود محتاج الموقع مرفوع'); return null; }
  _publish() { if (this.game) this.onView(this.game.view(this.seat)); }
  _runBot() {
    const step = () => {
      if (!this.game || this.game.over) return;
      const actor = this.game.seats.map(s => s.index)
        .find(i => this.game.legalActions(i).length);
      if (actor === undefined || actor === this.seat) return;
      const a = botAction(this.game, actor);
      if (!a) return;
      this.game.apply(actor, a);
      this._publish();
      setTimeout(step, 700);
    };
    setTimeout(step, 700);
  }
  submit(action) {
    if (!this.game) return;
    try { this.game.apply(this.seat, action); }
    catch (e) { console.warn('illegal', e.message); this._publish(); return; }
    this._publish(); this._runBot();
  }
  rematch() {
    const names = this.game.seats.map(s => s.name);
    this.game = new Game({mode: this.game.mode, matchType: 'ONE_V_ONE', names});
    this._publish(); this._runBot();
  }
}



const $ = id => document.getElementById(id);
let room = null, view = null, fmt = 'bot', mode = 'LUCK', picked = null;

const AR = f => (CARDS[f]?.ar) || f;
const KIND = f => (CARDS[f]?.kind) || 'special';
const icon = (face, px) => `<svg width="${px}" height="${px}" viewBox="0 0 40 44" fill="none"
  stroke="${GLOW[KIND(face)] || '#fff'}" stroke-width="2.6" stroke-linecap="round"
  stroke-linejoin="round">${ICONS[face] || ''}</svg>`;

document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-fmt]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); fmt = b.dataset.fmt;
});
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mode = b.dataset.mode;
});

/* ---------------------------------------------------------------- table state
   The engine clears its chain the moment a possession resolves, and a guest
   receives views over Firebase where intermediate states can coalesce. So the
   table history is built from v.log — every view carries the last 12 events,
   each with a monotonic id, and card plays name their seat:

     attack_played  {seat, face}
     defense_played {seat, face, stopped}
     own_goal_played{seat}            -> OWN_GOAL
     var            {seat, call, ...} -> VAR

   Tracking the highest id already consumed means nothing is double-counted and
   nothing inside the 12-event window is lost.                                */
let log = [];           // [{face, seat} | {sep:true}]
let lastEvent = 0;      // highest event id folded into log
let drawnCount = 0;     // history entries already animated
let pendingSep = false; // a possession ended; divide before the next card
let lastPossession = null;  // turnovers are silent, so watch this directly

/* LUCK deals the card itself, so "pulling" is a UI gate: a newly arrived card
   sits face-down and unplayable until the deck is tapped. No rules change. */
let prevHand = [];
let facedown = [];
let busyDeck = false;

const CARD_EVENTS = {
  attack_played:   e => ({face: e.face, seat: e.seat}),
  defense_played:  e => ({face: e.face, seat: e.seat}),
  own_goal_played: e => ({face: 'OWN_GOAL', seat: e.seat}),
  var:             e => ({face: 'VAR', seat: e.seat}),
};
const ENDS_POSSESSION = new Set([
  'goal', 'goal_overturned', 'possession_conceded', 'counter_attack', 'match_over',
]);

/** Fold any unseen events from this view into the table history. */
function foldEvents(v) {
  const evs = (v.log || []).filter(e => e && typeof e.id === 'number');

  if (!evs.length) return;

  /* v.log is only the last 12 events. On a bad connection a guest can miss
     more than that between updates, and those cards are simply gone — the
     engine cannot be asked for them again. Same for a player who reconnects
     mid-match. Rather than show a history that is quietly wrong, mark the
     hole. A fresh match starts at id 1, so no marker appears there. */
  const oldest = Math.min(...evs.map(e => e.id));
  if (oldest > lastEvent + 1) log.push({gap: true});

  for (const e of evs) {
    if (e.id <= lastEvent) continue;
    lastEvent = e.id;
    const make = CARD_EVENTS[e.kind];
    if (make) {
      if (pendingSep) { log.push({sep: true}); pendingSep = false; }
      log.push(make(e));
    } else if (ENDS_POSSESSION.has(e.kind) && log.length) {
      pendingSep = true;   // inserted lazily so the strip never ends on a line
    }
    /* A stopped attack closes the exchange. Checked AFTER the card is pushed,
       because a defending Interception belongs to the ATTACKER's exchange —
       it closes that possession, it does not open the interceptor's. */
    if (e.kind === 'defense_played' && e.stopped && log.length) pendingSep = true;
  }

  /* A TURNOVER EMITS NO EVENT OF ITS OWN — the engine just flips possession
     and clears the chain. Without this, an Interception followed by the
     winner's own Shot renders as one player laying down two cards in a single
     turn. Catches every cause without enumerating them: foul, concede,
     counter-attack, neutral stops. */
  if (lastPossession !== null && v.possession !== lastPossession && log.length) {
    pendingSep = true;
  }
  lastPossession = v.possession;
}

/** Reset the table between matches. */
function resetTable() {
  log = []; lastEvent = 0; drawnCount = 0; pendingSep = false;
  lastPossession = null;
  prevHand = []; facedown = []; busyDeck = false;
  $('fan').innerHTML = '';
  $('hist').innerHTML = '';
}

function makeRoom() {
  return new Room({
    onView: v => {
      // rematch() builds a new Game, which resets eventId to 0. So if the
      // highest id in this view is behind what we have already folded, the
      // match restarted and the table starts over.
      const maxId = Math.max(0, ...(v.log || []).map(e => (e && e.id) || 0));
      if (maxId < lastEvent) resetTable();
      foldEvents(v);

      const ids = v.hand.map(c => c.id);
      if (v.mode === 'LUCK' && prevHand.length) {
        const fresh = ids.filter(id => !prevHand.includes(id));
        if (fresh.length && v.legal.length) facedown = fresh;
      }
      prevHand = ids;

      view = v;
      $('waiting').classList.add('hide');
      $('game').classList.remove('hide');
      render();
    },
    onLobby: info => {
      $('roomcode').textContent = info.code;
      localStorage.setItem('og_code', info.code);
      $('lobby').classList.add('hide');
      if (!info.started) $('waiting').classList.remove('hide');
      $('lobbylist').innerHTML = '<h2>اللاعبين</h2>' + info.players.map(p =>
        `<div class="row" style="margin:0 0 6px"><span>${p.name}${p.bot ? ' 🤖' : ''}</span>
         <span class="pill live">${p.bot ? 'بوت' : 'موجود'}</span></div>`).join('') +
        `<div class="hint">مستني ${info.size - info.players.length} لاعب كمان</div>`;
    },
    onError: msg => { alert(msg); $('lobby').classList.remove('hide');
                      $('waiting').classList.add('hide'); },
  });
}

$('create').onclick = async () => {
  const name = $('name').value.trim() || 'لاعب';
  room = makeRoom();
  try { await room.create(mode, fmt, name); }
  catch (e) { alert('مشكلة في الاتصال بـ Firebase: ' + e.message); }
};

$('join').onclick = async () => {
  const c = $('joincode').value.trim().toUpperCase();
  if (c.length !== 5) return alert('الكود 5 حروف');
  room = makeRoom();
  try { await room.join(c, $('name').value.trim() || 'لاعب'); }
  catch (e) { alert('مشكلة في الاتصال بـ Firebase: ' + e.message); }
};

/** Back to the front screen, after cleaning up whatever we published. */
async function exitRoom() {
  if (room) {
    // The host is the referee, so its exit ends the match for everybody.
    if (room.isHost && !room.local && room.game &&
        !confirm('انت الهوست — لو خرجت الماتش يخلص لكل اللاعبين. متأكد؟')) return;
    try { await room.leave(); } catch (e) { console.warn(e); }
  }
  room = null;
  view = null;
  resetTable();
  localStorage.removeItem('og_code');
  $('game').classList.add('hide');
  $('waiting').classList.add('hide');
  $('lobby').classList.remove('hide');
}

$('exitwait').onclick = exitRoom;
$('exitgame').onclick = exitRoom;

const PHASE_TEXT = {
  attack_draw: ['اسحب كام كارت؟', 'وتلعب نفس العدد بالظبط'],
  attack: ['دورك تهجم', 'الشوطة لازم تكون آخر كارت في السلسلة'],
  defense_draw: ['اسحب كام كارت للدفاع؟', 'أول كارت يكسر الاستحواذ، والباقي يبقى مرتدتك'],
  defense: ['رد على الهجمة', 'لازم تلعب كارت حتى لو مالكش رد'],
  react_own_goal: ['الشوطة عدّت! معاك Own Goal', 'تلعبه؟ النقطة تتحسب لك'],
  react_var: ['اتسجل هدف — معاك VAR', 'اختار وش أو ضهر: ضهر يلغي الهدف'],
};

function render() {
  const v = view;
  $('score').textContent = `${v.score[0]} — ${v.score[1]}`;
  $('names').textContent = v.seats.map(s =>
    `${s.name}${s.index === v.you ? ' (انت)' : ''} · ${s.cards}`).join(' | ');
  $('deckinfo').textContent = `الهدف ${v.goals_to_win} أهداف`;
  $('deckleft').textContent = v.deck_left;
  $('discard').textContent = v.discard;

  const mine = v.legal.length > 0;
  $('turnpill').textContent = facedown.length ? 'اسحب' : (mine ? 'دورك' : 'مستني');
  $('turnpill').className = 'pill' + (mine ? ' live' : '');

  const p = facedown.length
    ? ['دوس على الديك', 'الكارت في إيدك بس لسه مقلوب']
    : (PHASE_TEXT[v.phase] || ['—', '']);
  $('prompt').className = 'prompt' + (mine ? ' mine' : '');
  $('prompt').innerHTML = mine ? `${p[0]}<small>${p[1]}</small>`
    : `الاستحواذ مع ${v.seats[v.possession]?.name || ''}<small>مستني اللاعب التاني</small>`;

  $('feed').innerHTML = (v.log || []).slice(-4).reverse().map(logLine).filter(Boolean).join('<br>');

  renderFan();
  renderTable();
  renderDeck();
  renderHand();

  if (v.over) {
    const meTeam = v.you % 2;
    $('over').classList.remove('hide');
    $('over').innerHTML =
      `<div class="big" style="color:${v.winner === meTeam ? 'var(--defense-glow)' : 'var(--attack-glow)'}">
        ${v.winner === meTeam ? 'كسبت' : 'خسرت'}</div>
       <div class="hint">${v.score[0]} — ${v.score[1]}</div>
       <button class="go" id="again" style="margin-top:14px">ماتش تاني</button>`;
    $('again').onclick = () => {
      $('over').classList.add('hide');
      resetTable();
      room.rematch();
    };
  } else $('over').classList.add('hide');
}

function logLine(e) {
  const n = s => view.seats[s]?.name || '';
  switch (e.kind) {
    case 'attack_played':  return `<b>${n(e.seat)}</b> لعب ${AR(e.face)}`;
    case 'defense_played': return `<b>${n(e.seat)}</b> رد بـ ${AR(e.face)}` +
      (e.stopped ? ' — وقفها' : ' — مظبطتش');
    case 'goal':           return `⚽ <b>${n(e.scorer)}</b> سجل! ${e.score[0]} — ${e.score[1]}`;
    case 'goal_overturned':return `❌ الهدف اتلغى بالـ VAR`;
    case 'var':            return `📺 VAR: ${e.flip === 'heads' ? 'وش' : 'ضهر'}`;
    case 'own_goal_played':return `🔄 <b>${n(e.seat)}</b> لعب أون جول`;
    case 'counter_attack': return `⚡ <b>${n(e.seat)}</b> بيرتد بـ ${e.cards} كروت`;
    case 'possession_conceded': return `<b>${n(e.seat)}</b> سلّم الاستحواذ`;
    case 'chain_passed':   return `${AR(e.face)} عدّت بلا رد`;
    case 'reshuffled':     return `<b>${n(e.seat)}</b> بدّل كروت`;
    case 'match_over':     return `🏁 الماتش خلص`;
    default: return '';
  }
}

/* Opponents and team-mates as face-down fans. Counts come from v.seats, which
   carries hand SIZE and never contents — that is the privacy model. */
function renderFan() {
  const v = view, box = $('fan');
  const others = v.seats.filter(s => s.index !== v.you);
  const key = others.map(s => `${s.index}:${s.cards}`).join(',');
  if (box.dataset.key !== key) {
    box.innerHTML = '';
    others.forEach(s => {
      const mate = s.team === v.seats[v.you].team;
      const wrap = document.createElement('div');
      wrap.className = 'seatfan' + (mate ? ' mate' : '');
      for (let i = 0; i < s.cards; i++) {
        const b = document.createElement('div');
        b.className = 'back drawn';
        b.innerHTML = '<div class="crest">ج</div>';
        wrap.appendChild(b);
      }
      box.appendChild(wrap);
    });
    box.dataset.key = key;
  }
  $('oppname').textContent = others.map(s =>
    `${s.name}${s.team === v.seats[v.you].team ? ' (معاك)' : ''} · ${s.cards}`).join('  |  ');
}

/* The whole match history, newest last. Only the final two are legible; the
   rest collapse into an overlapping pile that scrolls. */
function renderTable() {
  const box = $('hist');
  box.innerHTML = '';
  const cards = log.filter(e => !e.sep && !e.gap);
  const cut = cards.length - 2;
  let seen = 0;

  log.forEach(e => {
    if (e.sep) {
      const d = document.createElement('div');
      d.className = 'sep';
      box.appendChild(d);
      return;
    }
    if (e.gap) {
      const d = document.createElement('div');
      d.className = 'gap';
      d.textContent = '···';
      d.title = 'كروت اتلعبت وانت مش متصل';
      box.appendChild(d);
      return;
    }
    const idx = seen++;
    const old = idx < cut;
    const byMe = e.seat === view.you;
    const el = document.createElement('div');
    el.className = `hcard ${KIND(e.face)} ${byMe ? 'mine' : 'theirs'}` +
      (old ? ' old' : '') +
      (idx >= drawnCount ? (byMe ? ' fresh' : ' freshflip') : '');
    el.innerHTML = old
      ? `<div class="edge"></div>${icon(e.face, 15)}`
      : `<div class="en">${(CARDS[e.face] || {}).en || e.face}</div>
         <div>${icon(e.face, 19)}</div><div class="nm">${AR(e.face)}</div>
         <div class="by">${(view.seats[e.seat] || {}).name || ''}</div>`;
    box.appendChild(el);
  });

  drawnCount = cards.length;
  $('tablehint').classList.toggle('hide', cards.length > 0);
  box.scrollLeft = box.scrollWidth;
}

function flyCard(i) {
  const f = document.createElement('div');
  f.className = 'flyer';
  f.style.animationDelay = `${i * 110}ms`;
  $('table').appendChild(f);
  setTimeout(() => f.remove(), 760 + i * 110);
}

/* Drawing is done BY TAPPING THE DECK. In STRATEGY the tap submits a real draw
   action (and asks 1/2/3 when there is a choice). In LUCK the engine has
   already dealt the card, so the tap only reveals it. */
function renderDeck() {
  const pile = $('deckpile'), pick = $('draws');
  const draws = view.legal.filter(a => a.type === 'draw');
  pick.innerHTML = '';
  pick.classList.add('hide');
  pile.onclick = null;

  if (facedown.length) {
    pile.className = 'deckpile can';
    pile.onclick = () => pullDealt();
    return;
  }
  pile.className = 'deckpile' + (draws.length ? ' can' : '');
  if (!draws.length) return;

  if (draws.length === 1) {
    pile.onclick = () => submitDraw(draws[0]);
    return;
  }
  pile.onclick = () => pick.classList.toggle('hide');
  draws.forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.n;
    b.onclick = ev => { ev.stopPropagation(); pick.classList.add('hide');
                        submitDraw(a); };
    pick.appendChild(b);
  });
}

function submitDraw(action) {
  if (busyDeck) return;
  busyDeck = true;
  const n = action.n || 1;
  for (let i = 0; i < n; i++) flyCard(i);
  setTimeout(() => {
    busyDeck = false;
    room.submit({type: 'draw', n});
  }, 300 + (n - 1) * 110);
}

/** LUCK only: reveal the card the engine already dealt. Submits nothing. */
function pullDealt() {
  if (busyDeck) return;
  busyDeck = true;
  const n = facedown.length;
  for (let i = 0; i < n; i++) flyCard(i);
  setTimeout(() => {
    facedown = [];
    busyDeck = false;
    render();
  }, 320 + (n - 1) * 110);
}

function renderHand() {
  const v = view, box = $('hand');
  box.innerHTML = '';
  const gated = facedown.length > 0;

  v.hand.forEach(c => {
    const acts = gated ? [] : v.legal.filter(a => a.card_id === c.id);
    const isSplit = c.kind === 'split' && c.faces.length > 1;

    const el = document.createElement('div');
    el.className = 'card ' + (isSplit ? 'split' : KIND(acts[0]?.face || c.faces[0]))
      + (acts.length ? '' : ' dead')
      + (facedown.includes(c.id) ? ' facedown' : '');
    if (acts.some(a => a.counters)) {
      const t = document.createElement('span');
      t.className = 'tick';
      t.textContent = '✓ رد صح';
      el.appendChild(t);
    }

    if (isSplit) {
      const mark = document.createElement('span');
      mark.className = 'splitmark';
      mark.textContent = 'SPLIT';
      el.appendChild(mark);
    }

    // A split card renders BOTH halves; a full card renders its single face.
    (isSplit ? c.faces : [acts[0]?.face || c.faces[0]]).forEach(face => {
      const kind = KIND(face);
      const d = CARDS[face] || {ar: face, en: face, line: ''};
      const faceActs = acts.filter(a => a.face === face);
      const half = document.createElement('div');
      half.className = `half ${kind} ` + (faceActs.length ? 'on' : 'off');
      half.innerHTML = `<div class="en">${d.en}</div>
        <div class="ar">${d.ar}</div>
        <div class="ico">${icon(face, isSplit ? 22 : 34)}</div>` +
        (isSplit ? '' : `<div class="ln">${d.line || ''}</div>
         <div class="bar" style="background:${FAMILY[kind]}"></div>`);

      if (faceActs.length) {
        const key = `${c.id}:${face}`;
        half.onclick = ev => {
          ev.stopPropagation();
          // One action: play it. Several (VAR's heads/tails): ask which.
          if (faceActs.length === 1) return submit(faceActs[0]);
          picked = picked === key ? null : key;
          renderHand();
        };
        if (picked === key) {
          el.classList.add('pick');
          const dual = document.createElement('div');
          dual.className = 'dual';
          faceActs.forEach(a => {
            const b = document.createElement('button');
            b.textContent = a.call ? (a.call === 'heads' ? 'وش' : 'ضهر') : AR(a.face);
            b.onclick = ev => { ev.stopPropagation(); submit(a); };
            dual.appendChild(b);
          });
          half.appendChild(dual);
        }
      }
      el.appendChild(half);
    });

    box.appendChild(el);
  });

  if (gated) return;
  v.legal.filter(a => ['pass','concede_possession'].includes(a.type)).forEach(a => {
    const b = document.createElement('div');
    b.className = 'card special';
    b.innerHTML = `<div class="en">SKIP</div>
      <div class="ar">${a.type === 'pass' ? 'سيبها' : 'سلّم الكورة'}</div>
      <div class="ico">${icon('CHAIN', 30)}</div>
      <div class="ln">${a.type === 'pass' ? 'متلعبش الكارت' : 'مفيش كارت هجومي'}</div>
      <div class="bar" style="background:var(--special)"></div>`;
    b.onclick = () => submit(a);
    box.appendChild(b);
  });
}

function submit(a) {
  picked = null;
  const {counters, ...action} = a;
  room.submit(action);
}

const last = localStorage.getItem('og_code');
if (last && last !== 'BOT') {
  $('joincode').value = last;
  $('join').textContent = `ارجع لأوضة ${last}`;
}

</script>
